# Application
spring.application.name=dvelupmint

#Admin Credentials

spring.datasource.AdminPassword = ${ADMIN_PASSWORD}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# JWT Configuration (using email)
jwt.secret=${JWT_SECRET:defaultWeakSecretForDevelopmentOnly}
jwt.refreshExpirationMs=${JWT_REFRESHMENT:86400000}
jwt.expirationMs = ${JWT_EXPIRATION:900000}
# Server
server.port=8081

# Hibernate
spring.jpa.hibernate.ddl-auto=update
